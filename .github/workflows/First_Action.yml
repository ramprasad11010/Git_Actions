#Git Actions sample file
name: My Git actions file
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
        - name: Sample output
          run: hostname
        - name: Check installation status
          run: terraform --version
        - name: checkout
          uses: actions/checkout@v2
        - name: init terraform
          run: terraform init
        - name: plan
          run: terraform plan
        - name: apply
          run: terraform apply -auto-approve
        - name: destroy
          run: terraform destroy -auto-approve






  
